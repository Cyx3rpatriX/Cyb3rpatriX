<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulseGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path id="trace" d="M20 45 L1180 45" fill="none" stroke="#12505C" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- five domain nodes -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="10" fill="#6C8A94">
    <circle cx="140" cy="45" r="5" fill="#0B121C" stroke="#4DE8FF" stroke-width="1.5" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="45" r="5" fill="#0B121C" stroke="#4DE8FF" stroke-width="1.5" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="45" r="5" fill="#0B121C" stroke="#FF7A33" stroke-width="1.5" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="45" r="5" fill="#0B121C" stroke="#4DE8FF" stroke-width="1.5" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="6s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="45" r="5" fill="#0B121C" stroke="#4DE8FF" stroke-width="1.5" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="6s" begin="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- traveling pulse -->
  <circle r="3.5" fill="#8FF3FF" filter="url(#pulseGlow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#trace"/>
    </animateMotion>
  </circle>
</svg>
